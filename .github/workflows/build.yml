name: Build PDFs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same ref instead of letting them pile
# up: every queued run re-fetches the Typst distribution, and concurrent
# fetches are what intermittently trips setup-typst.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Lint chapters
        run: python3 scripts/lint_chapters.py

  build:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      # Throttle the fan-out: 26 jobs starting at once means 26 concurrent
      # Typst downloads. Eight keeps the wall-clock short without the storm.
      max-parallel: 8
      matrix:
        subject:
          - cloud-and-infrastructure
          - coding
          - compilers
          - cpu-architecture
          - cryptography-and-security
          - data-engineering
          - database
          - distributed-systems
          - embedded-and-realtime
          - formal-methods
          - gpu-architecture
          - graphics-and-rendering
          - linux-kernel
          - llm
          - machine-learning-foundations
          - networking
          - observability-and-sre
          - operating-systems
          - programming-languages
          - quantum-computing
          - computer-vision
          - software-architecture
          - performance-engineering
          - numerical-computing
          - web-and-browsers
          - search-and-ir
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: '0.15.1'
      - name: Compile ${{ matrix.subject }}.typ
        run: |
          SNAKE=$(echo "${{ matrix.subject }}" | tr '-' '_')
          typst compile "${{ matrix.subject }}.typ" "${SNAKE}.pdf"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.subject }}-pdf
          path: "*.pdf"
          retention-days: 14
