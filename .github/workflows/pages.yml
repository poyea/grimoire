name: Deploy Pages

on:
  push:
    branches: [main]
    paths: ['docs/**', '**.typ', 'scripts/gen_homepage.py',
            'scripts/build_html.py', '.github/actions/setup-typst/**',
            '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate homepage from chapters
        run: python3 scripts/gen_homepage.py
      - uses: ./.github/actions/setup-typst
      # Typst HTML export is experimental, so this is best-effort: a volume
      # that fails is skipped and logged rather than blocking the deploy.
      # Output lands in docs/__compiled/ and is never committed.
      - name: Export volumes to HTML
        run: python3 scripts/build_html.py
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
