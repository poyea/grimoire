name: Build and Release PDF

on:
  push:
    tags:
      - '*'
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: '0.15.1'

      - name: Find and compile all Typst documents
        run: |
          # Find all .typ files in the root directory (not subdirectories)
          for typfile in *.typ; do
            if [ -f "$typfile" ] && [ "$typfile" != "template.typ" ]; then
              base="${typfile%.typ}"
              pdffile="grimoire_$(echo "$base" | tr '-' '_').pdf"
              echo "Compiling $typfile to $pdffile"
              typst compile "$typfile" "$pdffile"
            fi
          done

      - name: Build combined PDF
        run: |
          pip install pypdf
          python3 scripts/release_merge.py

      - name: Generate checksums
        run: sha256sum grimoire_*.pdf > SHA256SUMS

      - name: Generate release notes
        run: python3 scripts/release_notes.py > release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            grimoire_*.pdf
            SHA256SUMS
          draft: false
          prerelease: false
          body_path: release_notes.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
